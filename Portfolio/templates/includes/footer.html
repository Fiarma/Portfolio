{% load static %}

<footer>
    <div class="footer-container">
        <!-- Section Contacts centrée -->
        <div class="footer-section contact-links">
            <h3>Contacts</h3>
            <ul class="contact-grid">
                <li>
                    <a href="tel:+22652336153">
                        <img src="{% static 'images/tel.png' %}" alt="Téléphone"> +226 52 33 61 52
                    </a>
                </li>
                <li>
                    <a href="https://wa.me/22667489187" target="_blank">
                        <img src="{% static 'images/whatsapp.png' %}" alt="WhatsApp"> WhatsApp
                    </a>
                </li>
                <li>
                    <a href="mailto:fiarmafiarma@gmail.com">
                        <img src="{% static 'images/email.png' %}" alt="E-mail"> fiarmafiarma@gmail.com
                    </a>
                </li>
                <li>
                    <a href="https://www.linkedin.com/in/fiarma/" target="_blank">
                        <img src="{% static 'images/linkedin.jpeg' %}" alt="LinkedIn"> LinkedIn
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <div class="footer-copyright">
        <p>&copy; {{ current_year }} Mon Portfolio. Tous droits réservés.</p>
    </div>

    <style>
        /* Footer général */
        footer {
            background-color: rgb(50, 80, 179);
            color: white;
            padding: 2rem 1rem;
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            flex-shrink: 0;
        }

        .footer-container {
            display: flex;
            justify-content: center; /* centre la section unique */
            max-width: 1200px;
            margin: 0 auto;
        }

        .footer-section h3 {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            color: #fff;
            text-align: center;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(2, auto);
            gap: 1rem 2rem;
            list-style: none;
            padding: 0;
            margin: 0 auto;
        }

        .contact-grid li {
            margin-bottom: 0.8rem;
        }

        .contact-grid a {
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .contact-grid a img {
            width: 20px;
            height: 20px;
        }

        .footer-copyright {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }

        /* Sticky footer pour pages courtes */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }

        main {
            flex: 1;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .contact-grid {
                grid-template-columns: 1fr 1fr; /* reste 2x2 */
                gap: 0.5rem 1rem;
            }
        }

        @media (max-width: 480px) {
            .contact-grid {
                grid-template-columns: 1fr; /* passe en 1 colonne sur très petit écran */
                gap: 0.5rem 0;
            }
        }
    </style>
</footer>
